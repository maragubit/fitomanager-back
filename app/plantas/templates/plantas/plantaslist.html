{%extends 'core/base.html'%}
{%load static%}
{%block title%}Lista plantas{%endblock%}



{%block content%}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>


<style>
a {
color:darkgreen;
}
a:hover{
    color:yellowgreen;
    text-decoration: none;
}


#plantas{
margin-left:auto;
margin-right:auto;
max-width:1200px;
text-align: center;
}
#planta{
margin:2%;
display:inline-grid;
width:130px;
margin-bottom:100px;
height:120px;
}
#foto{
border-radius:5%;
}
#especie{
font-size: small;
}
</style>
<br>
<br>
<h2 style="text-align:center;color:#243d25;" class="titulo2">Plantas Medicinales</h2>
<br>
<div style="float:right; margin-right:5%;">
    <input id="buscador" type="text" placeholder="buscar...">
    <p style="font-size: x-small;"><i>*puede buscar incluso por activos</i></p>
</div>
<div style="margin-left:2%;float:left">
<label>Mostrar:</label>
<select  id="mostrarplantas" name="plantaslist">
    <option value=12 selected>12</option>
    <option value=24>24</option>
    <option value=36>36</option>
    <option value=1000>Todas</option>
</select>
</div>

<div style="display: inline-block; margin-left: 2%;">
    <label> Patologias:</label>
    <select id="patologias" name="patologias">
        <option value='todas' selected>todas</option>
        {%for patologia in indicaciones%}
        <option value={{patologia.id}}>{{patologia}}</option>
        {%endfor%}

    </select>
</div>
<br>
<br>
<div style="height:10px; background-color:green;"></div>
    <div id="plantas">

</div>

<div style="height:20px; background-color:green;"></div>



<script>
var plantasjs = {{ plantasjson|safe }};
var planta;
var value='';
var evidencia;
var mostrarvalue= document.getElementById('mostrarplantas').value;
var patologia = document.getElementById('patologias').value;;
var plantasgrid=document.getElementById('plantas');
for (planta in plantasjs) {
   if (planta < parseFloat(mostrarvalue) ){
   plantasgrid.innerHTML +='<div id=planta><h6 id=titulo style="text-align:center; height:35px; color:#243d25; background-color:white;"><a href=/plantas/planta/'+plantasjs[planta].pk+' > ' +plantasjs[planta].fields.nombre+ '</h5><img width=130, height=120, id=foto src=/media/'+plantasjs[planta].fields.imagen+'></img></a><h7 id="especie"><i>('+plantasjs[planta].fields.especie+')<i></h7></div>';
}};




$("#mostrarplantas").change(function(){
        mostrarvalue= document.getElementById('mostrarplantas').value;
        $.ajax({
            "type"      : "POST",
            "url"       : "{%url 'plantas'%}",
            "dataType"  : "json",
            "data"      : {"value": value,csrfmiddlewaretoken: '{{ csrf_token }}',plantasjs:'plantasjs','mostrarvalue':mostrarvalue,'patologia':patologia},
            "success"   : function(data){
                plantasjs= JSON.parse(data.plantasjs);
                plantasgrid.innerHTML='';
                var planta;
                for (planta in plantasjs) {
   if (planta < parseFloat(mostrarvalue) ){
   plantasgrid.innerHTML +='<div id=planta><h6 id=titulo style="text-align:center; height:35px; color:#243d25; background-color:white;"><a href=/plantas/planta/'+plantasjs[planta].pk+' > ' +plantasjs[planta].fields.nombre+ '</h5><img width=130, height=120, id=foto src=/media/'+plantasjs[planta].fields.imagen+'></img></a><h7 id="especie"><i>('+plantasjs[planta].fields.especie+')<i></h7></div>';
}};
            },

                });
   });


   $("#patologias").change(function(){
        patologia= document.getElementById('patologias').value;
        $.ajax({
            "type"      : "POST",
            "url"       : "{%url 'plantas'%}",
            "dataType"  : "json",
            "data"      : {"value": value,csrfmiddlewaretoken: '{{ csrf_token }}',plantasjs:'plantasjs','mostrarvalue':mostrarvalue,'patologia':patologia},
            "success"   : function(data){
                plantasjs= JSON.parse(data.plantasjs);
                plantasgrid.innerHTML='';
                var planta;
                for (planta in plantasjs) {
   if (planta < parseFloat(mostrarvalue) ){
   plantasgrid.innerHTML +='<div id=planta><h6 id=titulo style="text-align:center; height:35px; color:#243d25; background-color:white;"><a href=/plantas/planta/'+plantasjs[planta].pk+' > ' +plantasjs[planta].fields.nombre+ '</h5><img width=130, height=120, id=foto src=/media/'+plantasjs[planta].fields.imagen+'></img></a><h7 id="especie"><i>('+plantasjs[planta].fields.especie+')<i></h7></div>';
}};
            },

                });
   });







$('#buscador').keydown(function() {
        value = this.value;
        $.ajax({
            "type"      : "POST",
            "url"       : "{%url 'plantas'%}",
            "dataType"  : "json",
            "data"      : {"value": value,csrfmiddlewaretoken: '{{ csrf_token }}',plantasjs:'plantasjs','mostrarvalue':mostrarvalue,'patologia':patologia,},
            "success"   : function(data){
                plantasjs= JSON.parse(data.plantasjs);
                plantasgrid.innerHTML='';
                var planta;
                for (planta in plantasjs) {

   plantasgrid.innerHTML +='<div id=planta><h6 id=titulo style="text-align:center; height:35px; color:#243d25; background-color:white; "><a href=/plantas/planta/'+plantasjs[planta].pk+' >' +plantasjs[planta].fields.nombre+ '</h6><img width=130, height=120, id=foto src=/media/'+plantasjs[planta].fields.imagen+'></img></a></div>';
};
            },

                });
   });
</script>
{%endblock%}
