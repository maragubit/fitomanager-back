<style>


#politicaprivacidad{
color:black
}
#politicaprivacidad:hover{
color:green;
text-decoration: none;
}


.topnav {
    overflow: hidden;
    padding-bottom: 0.5%;
    padding-top: 0.5%;
    box-shadow: 1px 2px 25px rgba(100, 100, 100, 0.3);
}

.topnav a {
  float: left;
  display: block;
  color: #253d25;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
}

.active {
  background-color: #4CAF50;
  color: white;
}

.topnav .icon {
  display: none;
}

.dropdowne {
  float: left;
  overflow: hidden;
}

.dropdowne .dropbtn {
  font-size: 17px;
  border: none;
  outline: none;
  color: black;
  font-weight: bold;
  padding: 14px 16px;
  background-color: white;
  font-family: inherit;
  margin: 0;
}

.dropdowne-content {
  display: none;
  position: absolute;
  background-color: white;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdowne-content a {
  float: none;
  color: black;
  font-weight: bold;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.topnav a:hover, .dropdowne:hover .dropbtn {
  background-color: #eaeaea;
  color: black;
}

.dropdowne-content a:hover {
  background-color: #eaeaea;
  color: black;
}

.dropdowne:hover .dropdowne-content {
  display: block;
}
#letrasnav{
    float:right;
    margin-right: 3%
  }

@media screen and (max-width: 1100px) {
  .topnav a:not(:first-child), .dropdowne .dropbtn {
    display: none;
  }
  .topnav a.icon {
    margin: 2%;
    float: right;
    display: block;
    border: solid 1px #253d25;
    border-radius:10%;
  }

}

@media screen and (max-width: 1100px) {

  .topnav.responsive .icon {
    position: absolute;
    right: 0;
    top: 0;
  }
  .topnav {
    width: 100%;
    position: fixed;
    background-color: white;
    z-index: 1001
}
  .topnav.responsive a {
    float: none;
    display: block;
    text-align: left;
  }
  .topnav.responsive .dropdowne {float: none;}
  .topnav.responsive .dropdowne-content {position: relative;}
  .topnav.responsive .dropdowne .dropbtn {
    display: block;
    width: 100%;
    text-align: left;
  }
  #letrasnav {
    float:none;
    margin-right: 1%;
    margin-top: 0.5%;
}

}
#promofarma_fito_grande{
    text-align: center;
}
#promofarma_fito_pequeño{
    display: none;
}
@media screen and (max-width: 750px){
#promofarma_fito_grande{
    display:none;
}
#promofarma_fito_pequeño{
    display: block;
    text-align:center;
}
}
</style>

            </div>
            <a href="javascript:void(0);" style="font-size:15px;" class="icon" onclick="myFunction()">&#9776;</a>
            </div>
    <br>

    <script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>
